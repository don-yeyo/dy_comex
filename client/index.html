<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <link rel="icon" href="/src/assets/logo-don-yeyo-png-sin-fondo.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d2c5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ComEx CRM">
    <meta name="application-name" content="ComEx CRM">
    <link rel="apple-touch-icon" href="/src/assets/logo-don-yeyo-png-sin-fondo.png">
    <meta name="description" content="ComEx CRM — Sistema de gestión de comercio exterior para Don Yeyo S.A. Pipeline, contactos, documentos, cobranzas e inteligencia comercial.">
    <title>ComEx CRM — Comercio Exterior Don Yeyo</title>
    <script>
      // Capturar 404 en scripts estáticos cuando hay un nuevo despliegue y auto-recargar
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[App] Recurso no encontrado (404), limpiando caché...', e.target.src || e.target.href);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
              if (!sessionStorage.getItem('asset_reload')) {
                sessionStorage.setItem('asset_reload', 'true');
                window.location.reload(true);
              }
            });
          } else if (!sessionStorage.getItem('asset_reload')) {
            sessionStorage.setItem('asset_reload', 'true');
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] ServiceWorker registrado con éxito:', reg.scope))
            .catch(err => console.error('[PWA] Error registrando ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
